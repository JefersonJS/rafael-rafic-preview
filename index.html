<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rafael Rafic — preview para aprovação</title>
<link rel="stylesheet" href="fontes/lato.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#28307e;color:#fff;
  font-family:Lato,"Segoe UI",system-ui,sans-serif;line-height:1.6;
  display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:640px;width:100%}
img{height:46px;width:auto;margin-bottom:28px}
h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;
  font-size:clamp(28px,6vw,42px);line-height:1.15;margin:0 0 12px}
p{color:#c9cbe8;margin:0 0 28px;max-width:52ch}
.telas{display:grid;gap:14px;margin-bottom:28px}
a.tela{display:flex;justify-content:space-between;align-items:center;gap:16px;
  background:rgba(255,255,255,.07);border-radius:12px;padding:18px 20px;
  color:#fff;text-decoration:none;min-height:64px}
a.tela:hover{background:rgba(255,255,255,.14)}
a.tela b{font-weight:700;display:block}
a.tela small{color:#b9bce0;font-size:13px}
a.tela span{color:#e88648;font-size:22px;line-height:1}
.aviso{font-size:13px;color:#9aa0d4;border-top:1px solid rgba(255,255,255,.14);
  padding-top:18px}
@media(min-width:640px){.telas{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
  <img src="midia/logo-320.webp" alt="Rafael Rafic" width="320" height="86">
  <h1>Preview para aprovação</h1>
  <p>Versão nova do site, para você conferir antes de publicarmos.
     Abra também pelo celular — foi onde mais mudou.</p>
  <div class="telas">
    <a class="tela" href="home.html">
      <span class="sr"></span>
      <span><b>Página inicial</b><small>Home reformulada</small></span>
      <span>→</span>
    </a>
    <a class="tela" href="casting.html">
      <span><b>Casting</b><small>46 creators, com filtros</small></span>
      <span>→</span>
    </a>
  </div>
  <p class="aviso">Endereço temporário, só para aprovação. O site oficial
     continua em <a href="https://rafaelrafic.com/" style="color:#b9bce0">
     rafaelrafic.com</a>.</p>
</main>
</body>
</html>
